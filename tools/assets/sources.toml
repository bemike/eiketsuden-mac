# Third-party archives read by the asset build (tools/assets/build.py).
#
# `fetch.py` downloads every entry into tools/assets/.cache/<file> and refuses to continue unless the
# file's size and SHA-256 match the values pinned here, so a rebuild always starts from exactly the
# same bytes. Only licences allowed by docs/ASSETS.md (CC0, CC-BY, CC-BY-SA, OFL, public domain) may
# appear here, and every source must be credited in CREDITS.md.
#
# Download methods:
#   url  = "..."                 plain HTTP(S) GET
#   [sources.<id>.itch]          itch.io "name your own price" flow: GET the page, POST its
#                                csrf_token to <page>/file/<upload>, then GET the short-lived
#                                signed URL returned in the JSON answer.

