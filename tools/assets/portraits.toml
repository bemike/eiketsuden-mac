# Officer portraits: which figure of 增像全圖三國演義 each officer gets, and how it is framed.
# Read by tools/assets/build_portraits.py (see its module doc for the image treatment).
#
# The book's portrait section (繡像) is on the pages pinned as source `xiuxiang` in sources.toml:
# djvu pages 15-50 of the CADAL scan, four full-length figures per page, each in a printed frame
# with the person's name and a short poem. Coordinates are pixels of the 1920x2992 page renders.
#
# [portraits.<key>]   one entry per portrait key of data/base/officers.toml (the officer id); an
#                     entry no officer uses is drawn as well (dramas can `@show` any portrait key,
#                     and officers of chapters in progress may not be in officers.toml yet) and
#                     listed by the build
#   figure    the name printed beside the figure (checked against [pages])
#   page      djvu page number
#   quad      TR / TL / BR / BL: the figure's quarter of the page
#   face      page point placed at the portrait's horizontal centre, 40 % from its top
#   width     crop width in page pixels (default 300); the height is width * 5 / 4
#   stand_in  true when the book has no figure of this officer and another person's figure is used
#   mirror    flip horizontally; required for the second use of a figure
#   erase     page rectangles [x0, y0, x1, y1] painted over with paper first (printed name or poem
#             text that would otherwise show inside the crop)
#
# Choosing stand-ins: the book has a figure for 52 of the officers. The others get figures of
# people who take no part in this game's story (mostly later generations and scholars), picked by
# type (warrior or official, age) and never from [reserved]. There are fewer usable figures than
# officers, so some figures serve twice, always for two people who should never share a battle
# (typically an enemy who dies in the prologue or chapter 1 and an officer who joins in chapter 3),
# one of them mirrored. Officers who stay in the story for long (e.g. 于禁, 樂進, 李典) get a figure
# of their own, or share one only with someone who is gone before they join. Figures without a
# usable face (back views and bows: 丁管, 北地王, 鍾會, 王經, 譙周, 蔡邕) and the monk 普淨 are not
# used; 文醜, 沮授 and 魏延 keep their own figures although the book draws them turned away.

