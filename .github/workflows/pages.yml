name: Web demo (GitHub Pages)

# Deployed only after CI passed on the main commit (or by hand). The site is built from that very
# commit, not from whatever main is by the time this runs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # GitHub Pages needs a public repository on the free plan; skip while the repository is private.
    # After CI, only a successful run of a push to main deploys.
    if: >-
      ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    steps:
      # Fails at once, with a clear message, when the repository's Pages source is not set to
      # "GitHub Actions" (a one-time setting, see docs/DEVELOPING.md "Publishing").
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build WebAssembly
        run: cargo build --release -p hero-game --target wasm32-unknown-unknown
      - name: Assemble site
        # The same step as tools/web/build.sh and build.ps1.
        run: python tools/web/assemble.py --wasm target/wasm32-unknown-unknown/release/eiketsuden.wasm --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
