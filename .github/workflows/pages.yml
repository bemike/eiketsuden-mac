name: Landing page (GitHub Pages)

# Publishes the static landing page in site/ as it is: no build step. The web demo that used to live
# here was taken down with the base pack's story (docs/DECISIONS.md D21).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A running deployment is not cancelled (GitHub's recommendation for Pages); every run deploys the
# tip of main (see the checkout step), so the order of runs does not matter.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails at once, with a clear message, when the repository's Pages source is not set to
      # "GitHub Actions" (a one-time setting, see docs/DEVELOPING.md "Publishing").
      - uses: actions/configure-pages@v5
      # Always the current tip of main, not the pushed commit: GitHub does not order runs within a
      # concurrency group, so a late run of an older push would otherwise roll the site back.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
