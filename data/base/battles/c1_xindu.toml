# Chapter 1, act 1 (계교 전투), first choice A: 신도 전투 (Xindu). Game-original prelude to Jieqiao
# (novel chapter 7): Yuan Shao's vanguard besieges Xindu, a town that holds out for Gongsun Zan.
#
# PC original: 30 turns, 4 deployable officers; enemy Chunyu Qiong Lv8 (light cavalry), three
# infantry squads Lv4, two bandit squads Lv2, two cavalry squads Lv1, an archer squad and a band
# Lv3; Chunyu Qiong waits on the northern road and only moves on turn 14. The town garrison fights
# as allied units. Victory: rout Chunyu Qiong (200 gold) or bring Liu Bei to the town gate (200 gold
# and +50 EXP for every surviving unit). Zhang Fei next to Chunyu Qiong starts a duel that ends the
# battle (+1 level, no bonus). Treasuries: wine at the front, 100 gold at the back. The garrison
# captain joins after the battle (yue_lin replaces the original's invented officer).
#
# Map: Xindu's walls close the west edge, the gate faces east. From the eastern start two roads run
# around a wooded ridge (north and south; the only ways for cavalry) and a footpath crosses it. Three
# infantry squads besiege the gate, Chunyu Qiong holds the northern road with his band, the cavalry
# patrols the southern road and the bandits lurk on the ridge.

id = "c1_xindu"
name = "신도 전투"
location = "191년, 기주 안평국 신도"
objective = "적장 순우경을 물리치거나 유비가 신도 성문에 이르라"
bgm = "battle"
bgm_enemy = "enemy"
turn_limit = 30
reward_gold = 200
intro = "xindu_intro"
outro = "xindu_outro"
victory = [
  { type = "defeat_unit", target = "chunyu_qiong" },
  { type = "reach", who = "liu_bei", pos = [5, 9], radius = 1 },
]
bonus = { condition = { type = "reach", who = "liu_bei", pos = [5, 9], radius = 1 }, exp = 50, desc = "유비가 신도 성문에 이르면 살아남은 전원 경험치 +50" }

[map]
theme = "field"
rows = '''
