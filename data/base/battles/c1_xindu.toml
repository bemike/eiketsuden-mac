# --- Events ---------------------------------------------------------------------------------------

# Duel: Zhang Fei next to Chunyu Qiong ends the battle (PC); the gate bonus is forfeited.
[[events]]
trigger = { type = "adjacent", a = "zhang_fei", b = "chunyu_qiong" }
actions = [
  { type = "drama", scene = "xindu_duel" },
  { type = "level_up", target = "zhang_fei", amount = 1 },
  { type = "retreat", target = "chunyu_qiong" },
  { type = "victory" },
]

# PC: Chunyu Qiong leaves the northern road on turn 14.
[[events]]
trigger = { type = "turn_start", turn = 14, side = "enemy" }
actions = [
  { type = "drama", scene = "xindu_chunyu_moves" },
  { type = "set_ai", target = "chunyu_qiong", ai = "aggressive" },
]

