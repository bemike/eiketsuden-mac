# Chapter 1, act 3 (서주의 새 주인), bandit camp 1: 태산 전투 (Mount Tai). Game-original
# bandit suppression while Liu Bei guards Xiaopei for Tao Qian (novel chapters 12-13 mention the
# Mount Tai bandits of the Xu region).
#
# PC original: 40 turns (the only 40-turn camp), 7 deployable officers; enemy chief Lv12 (beast
# tamer) holed up in a stronghold, seven bandit squads, two beast tamer squads and two martial
# artist squads; the only way up is slow wasteland under rockfall from the bandits on the slopes.
# Victory: annihilate the enemy (400 gold). Liu Bei next to the chief makes the chief surrender and
# join (Liu Bei +1 level; the battle ends). Treasuries (PC): 폭탄, 낙석서.
# (design) The chief is Chang Xi, a historical leader of the Mount Tai bandits (the original's is a
# character invented by KOEI).
#
# Map: mountains everywhere; narrow wasteland trails climb from the southern foothills past two
# small plateaus with villages to the walled stronghold at the top, with side ledges to two
# treasuries. Only bandits, martial artists and beast tamers can leave the trails; cavalry is slow
# on them. Levels: the console levels less five (the PC offset of this act).

id = "c1_taishan"
name = "태산 전투"
location = "195년, 연주 태산군"
objective = "적을 모두 물리쳐라 (유비가 창희를 설득하면 전투가 끝난다)"
bgm = "battle"
bgm_enemy = "enemy"
turn_limit = 40
reward_gold = 400
intro = "taishan_intro"
outro = "taishan_outro"
victory = [{ type = "defeat_all" }]

[map]
theme = "mountain"
rows = '''
