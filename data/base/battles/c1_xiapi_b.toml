# --- Events ---------------------------------------------------------------------------------------

# Defections (PC): Liu Bei next to one of the three wavering officers.
[[events]]
trigger = { type = "adjacent", a = "liu_bei", b = "hou_cheng" }
actions = [
  { type = "drama", scene = "xiapi_hou_cheng" },
  { type = "level_up", target = "liu_bei", amount = 1 },
  { type = "give_item", item = "red_hare" },
  { type = "retreat", target = "hou_cheng" },
  { type = "spawn", group = "hou_band" },
]

[[events]]
trigger = { type = "adjacent", a = "liu_bei", b = "song_xian" }
actions = [
  { type = "drama", scene = "xiapi_song_xian" },
  { type = "level_up", target = "liu_bei", amount = 1 },
  { type = "retreat", target = "song_xian" },
  { type = "spawn", group = "song_band" },
]

[[events]]
trigger = { type = "adjacent", a = "liu_bei", b = "wei_xu" }
actions = [
  { type = "drama", scene = "xiapi_wei_xu" },
  { type = "level_up", target = "liu_bei", amount = 1 },
  { type = "retreat", target = "wei_xu" },
  { type = "spawn", group = "wei_band" },
]

# All three groups together inside the walls: the gate opens. (Hou Cheng's and Song Xian's men
# stand side by side and call out the men between them, who stand next to Wei Xu's.)
[[events]]
trigger = { type = "adjacent", a = "hou_band", b = "song_band" }
actions = [{ type = "spawn", group = "pair_band" }]

[[events]]
trigger = { type = "adjacent", a = "pair_band", b = "wei_band" }
actions = [
  { type = "drama", scene = "xiapi_gate_opens" },
  { type = "spawn", group = "sortie" },
  { type = "set_ai", target = "cao_cao", ai = "target", ai_target = "lu_bu" },
  { type = "set_ai", target = "xiahou_dun", ai = "aggressive" },
  { type = "set_ai", target = "xiahou_yuan", ai = "aggressive" },
  { type = "set_ai", target = "cao_ren", ai = "aggressive" },
  { type = "set_ai", target = "cao_hong", ai = "aggressive" },
  { type = "set_ai", target = "guo_jia", ai = "aggressive" },
  { type = "set_ai", target = "xun_yu", ai = "aggressive" },
]

# PC: on turn 30 the men inside rise anyway (the events above then open the gate).
[[events]]
trigger = { type = "turn_start", turn = 30 }
actions = [
  { type = "spawn", group = "hou_band" },
  { type = "spawn", group = "song_band" },
  { type = "spawn", group = "wei_band" },
]

# Duel: Guan Yu next to Zhang Liao (+1 level); Zhang Liao withdraws.
[[events]]
trigger = { type = "adjacent", a = "guan_yu", b = "zhang_liao" }
actions = [
  { type = "drama", scene = "xiapi_duel" },
  { type = "level_up", target = "guan_yu", amount = 1 },
  { type = "retreat", target = "zhang_liao" },
]

