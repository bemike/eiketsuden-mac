# Chapter 1, act 4 (하비의 물길) finale: 하비 전투 (Xiapi), without Gao Shun. Same battle, map and
# events as c1_xiapi.toml (read that header first): players whose Zhang Fei beat Gao Shun in the
# duel at Pengcheng face Lü Bu without him (22 units).

id = "c1_xiapi_b"
name = "하비 전투"
location = "198년, 서주 하비국 하비성"
objective = "적장 세 명을 설득해 성문을 열게 한 뒤 여포를 물리쳐라"
bgm = "battle"
bgm_enemy = "boss"
turn_limit = 45
reward_gold = 500
intro = "xiapi_intro"
outro = "xiapi_outro"
victory = [{ type = "defeat_unit", target = "lu_bu" }]

