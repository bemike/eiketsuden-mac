# Chapter 1, act 4 (여포 토벌전) finale: 하비 전투 (Xiapi). Novel chapter 19: Cao Cao and Liu Bei
# besiege Lü Bu in Xiapi and flood the city; Hou Cheng steals the Red Hare and deserts, Song Xian and
# Wei Xu seize Lü Bu and open the gate, and Lü Bu is captured. This file has Gao Shun in the roster;
# c1_xiapi_b.toml is the same battle for players whose Zhang Fei beat Gao Shun at Pengcheng.
#
# PC original: 45 turns, 7 deployable officers with Zhang Fei required; enemy Lü Bu Lv21 (heavy
# cavalry) with Zhang Liao, Chen Gong, Gao Shun about Lv18, Hou Cheng, Song Xian, Wei Xu, Xu Si
# about Lv17, Wang Kai Lv16 and generic squads (23 units). Phase 1: lower the drawbridge. Liu Bei
# next to Hou Cheng, Song Xian or Wei Xu makes that officer defect (Liu Bei +1 level each); once all
# three have defected the bridge comes down, otherwise it drops at the start of turn 30; Cao Cao's
# army then joins the fight as allies. Phase 2: rout Lü Bu (500 gold). Guan Yu next to Zhang Liao starts a
# duel (+1 level); Zhang Fei cannot duel Lü Bu here. Treasures: 방천화극 and 적토마.
# (design) The engine cannot change terrain, so the city stays sealed behind its moat and the
# "drawbridge" is Lü Bu's sortie: when the gate opens, Lü Bu and his guard appear on the bank before
# it and fall on whoever comes within reach. Every defector's men gather inside the walls as allied
# units; the gate opens when all three groups stand together (hou_band + song_band call out
# pair_band, which joins wei_band), and on turn 30 the men inside rise anyway. Hou Cheng brings the
# Red Hare with him (novel) and Lü Bu drops his halberd; the two outer treasuries hold rice and a
# 원대서. Cao Cao's besieging army stands in the south from the start but only holds its lines until
# the gate opens; its officers keep the same levels whatever was chosen at Xiaopei (Cao Cao himself
# holds his post until then). Officers are a level below the PC values and squads Lv14 (PC about
# 15-16). The besieged army holds its camps (guard) and only two cavalry squads ride out, so the
# army can take the camps one at a time and win over the three officers before the gate opens.
#
# Map: the flooded city fills the north, ringed by its moat; outer camps with forts guard the west,
# the east and the south-centre, and the army comes up the southern road.

