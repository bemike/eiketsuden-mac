objective = "적장 세 명을 설득해 성문을 열게 한 뒤 여포를 물리쳐라"
bgm = "battle"
bgm_enemy = "boss"
turn_limit = 45
reward_gold = 500
intro = "xiapi_intro"
outro = "xiapi_outro"
victory = [{ type = "defeat_unit", target = "lu_bu" }]

