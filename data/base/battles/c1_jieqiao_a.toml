# --- Events ---------------------------------------------------------------------------------------

# Duel: Zhang Fei next to Wen Chou (+1 level); Wen Chou withdraws.
[[events]]
trigger = { type = "adjacent", a = "zhang_fei", b = "wen_chou" }
actions = [
  { type = "drama", scene = "jieqiao_duel" },
  { type = "level_up", target = "zhang_fei", amount = 1 },
  { type = "retreat", target = "wen_chou" },
]

[[events]]
trigger = { type = "adjacent", a = "gs_general", b = "wen_chou" }
actions = [
  { type = "drama", scene = "jieqiao_general_falls" },
  { type = "retreat", target = "gs_general" },
]

# PC: taking the first treasury lures Yuan Shao out towards the south fort ...
[[events]]
trigger = { type = "reach", pos = [21, 8] }
actions = [
  { type = "drama", scene = "jieqiao_yuan_advances" },
  { type = "set_ai", target = "yuan_shao", ai = "advance", ai_pos = [22, 16] },
]

# (design) Losing the south fort also brings him out to retake it.
[[events]]
trigger = { type = "unit_defeated", target = "chen_lin" }
actions = [
  { type = "drama", scene = "jieqiao_yuan_retakes_fort" },
  { type = "set_ai", target = "yuan_shao", ai = "advance", ai_pos = [22, 16] },
]

# ... and Liu Bei nearing the stockade sends him hurrying back to the granary.
[[events]]
trigger = { type = "reach", who = "liu_bei", pos = [6, 17], radius = 6 }
actions = [
  { type = "drama", scene = "jieqiao_yuan_returns" },
  { type = "set_ai", target = "yuan_shao", ai = "guard", ai_pos = [3, 20] },
]

