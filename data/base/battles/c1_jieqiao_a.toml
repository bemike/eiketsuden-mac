# Chapter 1, act 1 finale: 계교 전투 (Jieqiao), after the Julu route. Novel chapter 7: Yuan Shao
# routs Gongsun Zan at the Jie bridge, Wen Chou chases Gongsun Zan until the young Zhao Yun saves him,
# and Liu Bei's brothers arrive. This file is the roster for players who fought at Julu; officers
# already beaten there stay away (c1_jieqiao_b.toml is the Qinghe-route roster).
#
# PC original: 40 turns, 5 deployable officers, no shop before it; allied Zhao Yun Lv11, Gongsun Zan
# Lv8 and two more officers, one of whom Wen Chou cuts down; enemy Yuan Shao Lv13 (infantry), Wen
# Chou Lv10, Qu Yi Lv10 and eight more officers Lv7-8 with generic squads Lv3-6 (17 units). Victory:
# rout Yuan Shao (400 gold) or bring Liu Bei to Yuan Shao's empty granary (+50 EXP for every
# survivor). Zhang Fei next to Wen Chou starts a duel (+1 level, Wen Chou withdraws). Taking the
# first treasury makes Yuan Shao march out towards the south fort; Liu Bei nearing his camp sends him
# hurrying back. Treasuries (PC): 화룡서, 장창, 보리, 연노.
# (design) The officer Wen Chou cuts down is an unnamed general, as in the novel; the other allied
# officer is Shan Jing.
#
# Map: the army and Gongsun Zan's camp are north of the Qing river; the Jie bridge (two tiles wide)
# and a small western bridge cross it. A palisade with three openings splits the southern bank; the
# south fort guards the east, a village the centre, and Yuan Shao's stockade with the granary the
# south-west corner.

id = "c1_jieqiao_a"
name = "계교 전투"
location = "191년, 기주 광종 계교"
objective = "원소를 물리치거나 유비가 원소군 군량고를 차지하라"
bgm = "battle"
bgm_enemy = "boss"
turn_limit = 40
reward_gold = 400
intro = "jieqiao_intro"
outro = "jieqiao_outro"
victory = [
  { type = "defeat_unit", target = "yuan_shao" },
  { type = "reach", who = "liu_bei", pos = [2, 21] },
]
bonus = { condition = { type = "reach", who = "liu_bei", pos = [2, 21] }, exp = 50, desc = "유비가 원소군 군량고를 차지하면 살아남은 전원 경험치 +50" }

