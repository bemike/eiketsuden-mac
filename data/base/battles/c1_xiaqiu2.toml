# Chapter 1, act 4 (하비의 물길), route A: 하구 전투 2 (Second battle of Xiaqiu). Novel chapters
# 18-19 (the joint campaign of Cao Cao and Liu Bei against Lü Bu); the battle itself is one of the
# game's. Zhang Liao holds a mountain valley on the road to Xiapi.
#
# PC original: 30 turns, 7 deployable officers; allied Cao Ren, Cao Hong and Xun Yu; enemy Zhang
# Liao Lv17 (long-weapon infantry) with generic squads (infantry, cavalry, archers, a band) and
# three more squads falling on the rear on turn 5 (13 units); here on turn 6, from the corners of
# the valley mouth. Victory: rout Zhang Liao (500 gold).
# Hidden: Guan Yu next to Zhang Liao rebukes him for serving Lü Bu; he withdraws, Guan Yu gains a
# level and every survivor +50 EXP, with another 500 gold. The treasury (PC: 400 gold) can only be
# reached by units that climb mountains.
# (design) The rebuke's bonus is tied to Zhang Liao's standard-bearer (tag zl_banner), who appears
# beside him and withdraws with him only in the rebuke event; routing him in battle gives no bonus.
#
# Map: mountains on both sides of a valley that runs north to Zhang Liao's palisaded camp; ledges
# of wasteland on the western and eastern slopes, the treasury high on the western one.

id = "c1_xiaqiu2"
name = "하구 전투"
location = "198년, 서주 팽성국 하구"
objective = "적장 장료를 물리쳐라"
bgm = "battle"
bgm_enemy = "enemy"
turn_limit = 30
reward_gold = 500
intro = "xiaqiu2_intro"
outro = "xiaqiu2_outro"
victory = [{ type = "defeat_unit", target = "zhang_liao" }]
bonus = { condition = { type = "unit_retreated", target = "zl_banner" }, exp = 50, desc = "관우가 장료를 꾸짖어 물러나게 하면 살아남은 전원 경험치 +50" }

[map]
theme = "mountain"
rows = '''
^^^^^^^^^^,..,.,..^^^^^^^^^^
^^^^^^^^^^.,.,..,.^^^^^^^^^^
^^^^^^^^^^..,ff..,^^^^^^^^^^
^^^$^^^^^^,.b..b.,^^^^^^^^^^
^^^::^^^^.,..,.,..,^^^^^^^^^
^^^^::^^^.|||__|||,^^::^^^^^
^^^^^::^^...,__..,.^^^::^^^^
^^^^^^^^^.,.,__,.,.^^^^:^^^^
^^^^^^^^,TT..__,..,.^^^^^^^^
^^^^^^^^,T.,.__.,.TT^^^^^^^^
^^^^^^^^....,__..,T.^^^^X^^^
^^^^^^^^v.,.,__,.,..^^^^X^^^
^^^^^^^.,.,T.__,T.,.v^^^^X^^
^^^^^^^.,..,.__.,.,..^^^^X^^
^^^^^^^,TT..,__..,...^^^^^^^
^^^^^^^,..,.,__,.,..TT^^^^^^
^^^^^^..,.,..__,..,.,.^^^^^^
^^^^^^,v,..,.__.,.,..,^^^^^^
^^^^^^.,....,__..,....^^^^^^
^^^^^^.,..,.,__,.,..,.^^^^^^
'''

[deploy]
