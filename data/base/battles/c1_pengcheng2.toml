# Chapter 1, act 4 (하비의 물길), route B: 팽성 전투 2 (Second battle of Pengcheng). Novel
# chapters 18-19 (the joint campaign against Lü Bu); the battle itself is one of the game's. Gao
# Shun's picked troops hold the plain east of Pengcheng.
#
# PC original: 30 turns, 7 deployable officers; allied Xiahou Dun, Xiahou Yuan and Guo Jia, who
# close in from the east and like to steal the kills (even Gao Shun's); enemy Gao Shun Lv18 (beast
# tamer) with fourteen squads in all (infantry, five cavalry, archers, bandits, a band). Victory:
# rout Gao Shun (500 gold). Zhang Fei next to Gao Shun starts a duel that ends the battle (+1
# level) and keeps Gao Shun out of the battle of Xiapi (flag c1_gao_shun_duel). Treasury (PC): 마개.
# (design) The Cao officers arrive from the eastern edge on turn 3.
#
# Map: a stream with two fords west of an open plain; Gao Shun's palisaded camp in the centre-east
# opens to the west, the treasury lies behind it.

