actions = [
  { type = "drama", scene = "pengcheng2_duel" },
  { type = "level_up", target = "zhang_fei", amount = 1 },
  { type = "set_flag", flag = "c1_gao_shun_duel", value = 1 },
  { type = "retreat", target = "gao_shun" },
  { type = "victory" },
]

