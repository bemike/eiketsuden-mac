# Chapter 1, act 5 (옥대의 밀조): 광릉 전투 (Guangling). Novel chapter 21: Yuan Shu, his would-be
# empire in ruins, marches north to hand his imperial title to Yuan Shao; Liu Bei, sent by Cao Cao,
# bars the road, and Yuan Shu dies soon after.
#
# PC original: 30 turns, 7 deployable officers; enemy Yuan Shu Lv20 (long-weapon infantry), who
# carries the Imperial Seal and recovers every turn, Ji Ling Lv17 (heavy cavalry), Yue Jiu, Chen Ji,
# Yuan Yin and Li Feng and six generic squads (12 units); every enemy unit charges. A ridge in the
# middle of the plain cannot be crossed by the enemy. Victory: rout Yuan Shu (600 gold). Zhang Fei
# next to Ji Ling starts a duel that wins Ji Ling's three-pointed blade instead of a level (Ji Ling
# withdraws). Treasuries (PC): 칠성검 and 400 gold.
# (design) The two crossbow officers hold back until something comes within reach. Yuan Shu keeps
# his PC level; Ji Ling (16) and the other officers (14-15) stand below theirs and the squads are
# plain infantry, archers and bands (Lv14), because every one of them charges at once and the
# army only has seven units. Yuan Shu's seal is the pack's imperial_seal accessory (10% troops and
# 10 morale per turn); it is not dropped: in the novel it goes back to the court.
#
# Map: a wide plain; the northern road holds Liu Bei's line, Yuan Shu comes up the southern road,
# and a cliff-lined ridge in the middle forces the fighting round its western and eastern ends,
# where the two treasuries lie.

id = "c1_guangling"
name = "광릉 전투"
location = "199년, 서주 광릉군"
objective = "원술을 물리쳐라"
bgm = "battle"
bgm_enemy = "boss"
turn_limit = 30
reward_gold = 600
intro = "guangling_intro"
outro = "guangling_outro"
victory = [{ type = "defeat_unit", target = "yuan_shu" }]

[map]
