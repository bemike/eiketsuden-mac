# --- Events ---------------------------------------------------------------------------------------

# Duel (PC): Zhao Yun next to Guan Hai ends the battle.
[[events]]
trigger = { type = "adjacent", a = "zhao_yun", b = "guan_hai" }
actions = [
  { type = "drama", scene = "beihai_duel_zhao_yun" },
  { type = "level_up", target = "zhao_yun", amount = 1 },
  { type = "retreat", target = "guan_hai" },
  { type = "victory" },
]

# Duel (novel): Guan Yu next to Guan Hai ends the battle.
[[events]]
trigger = { type = "adjacent", a = "guan_yu", b = "guan_hai" }
actions = [
  { type = "drama", scene = "beihai_duel_guan_yu" },
  { type = "level_up", target = "guan_yu", amount = 1 },
  { type = "retreat", target = "guan_hai" },
  { type = "victory" },
]

# The garrison sorties once Liu Bei's army reaches the hills.
[[events]]
trigger = { type = "reach", pos = [14, 10], radius = 4 }
actions = [
  { type = "drama", scene = "beihai_sortie" },
  { type = "set_ai", target = "kong_rong", ai = "aggressive" },
  { type = "set_ai", target = "taishi_ci", ai = "aggressive" },
  { type = "set_ai", target = "zong_bao", ai = "target", ai_target = "guan_hai" },
]

# Novel: Zong Bao rides out against Guan Hai and falls.
[[events]]
trigger = { type = "adjacent", a = "zong_bao", b = "guan_hai" }
actions = [
  { type = "drama", scene = "beihai_zong_bao_falls" },
  { type = "retreat", target = "zong_bao" },
]

