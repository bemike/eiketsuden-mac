# Chapter 1, act 2 (북해, 서주 원군): 북해 전투 (Beihai). Novel chapter 11: the Yellow Turban remnant
# Guan Hai besieges Kong Rong in Beihai; Taishi Ci breaks out to fetch Liu Bei, and Guan Yu cuts
# Guan Hai down.
#
# PC original: 30 turns, 6 deployable officers with Zhao Yun (borrowed from Gongsun Zan) required;
# allied Kong Rong, Taishi Ci and a low-level officer who sortie from the city when Liu Bei's army
# reaches the hills; enemy Guan Hai Lv10 (bandit), eight bandit squads Lv5-6, two beast tamer squads
# Lv4 and two archer squads Lv6. The only bridge is narrow. Victory: rout Guan Hai (300 gold); Zhao
# Yun next to Guan Hai starts a duel that ends the battle (+1 level). Treasuries (PC): 평기서 and
# 특급주. Kong Rong adds 500 gold after the battle (c1_after_beihai).
# (design) The low-level allied officer is Zong Bao, who in the novel rides out against Guan Hai
# and is cut down; the novel's Guan Yu duel ends the battle too.
#
# Map: the river closes the western approach with a single narrow bridge. Beyond it the road runs
# through a gap in the hills to the besieged city in the east. Two hill valleys hold villages and
# treasuries: the northern valley is closed by mountains (only bandits, martial artists and beast
# tamers can climb in), the southern one opens to the south-west.

id = "c1_beihai"
name = "북해 전투"
location = "193년, 청주 북해국"
objective = "적장 관해를 물리쳐라"
bgm = "battle"
bgm_enemy = "enemy"
turn_limit = 30
reward_gold = 300
intro = "beihai_intro"
outro = "beihai_outro"
victory = [{ type = "defeat_unit", target = "guan_hai" }]

[map]
