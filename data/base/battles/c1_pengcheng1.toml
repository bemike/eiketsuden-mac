# --- Events ---------------------------------------------------------------------------------------

# Liu Bei next to Xia Kun: the chief gives up and joins (PC); the battle ends.
[[events]]
trigger = { type = "adjacent", a = "liu_bei", b = "xia_kun" }
actions = [
  { type = "drama", scene = "pengcheng1_surrender" },
  { type = "level_up", target = "liu_bei", amount = 1 },
  { type = "set_flag", flag = "c1_join_xia_kun", value = 1 },
  { type = "retreat", target = "xia_kun" },
  { type = "victory" },
]

# PC: going for the treasury springs a pincer.
[[events]]
trigger = { type = "reach", pos = [20, 10], radius = 3 }
actions = [
  { type = "spawn", group = "pincer" },
  { type = "drama", scene = "pengcheng1_pincer" },
]

