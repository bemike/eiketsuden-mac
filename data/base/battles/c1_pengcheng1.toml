# Chapter 1, act 3 (서주의 새 주인), bandit camp 3: 팽성 전투 1 (First battle of
# Pengcheng). Game-original bandit suppression near Xiaopei.
#
# PC original: 30 turns, 7 deployable officers; enemy chief Lv12 (bandit), six bandit squads, a
# beast tamer squad and four cavalry squads; going for the treasury draws a pincer attack, and the
# north-western village is the safe rallying point. Victory: annihilate the enemy (400 gold). Liu
# Bei next to the chief makes him join (Liu Bei +1 level; the battle ends). Treasury (PC):
# 검술지침서.
# (design) The chief is Xia Kun, a character written for this remake (the original's is a
# character invented by KOEI). The four cavalry squads are the pincer: they ride in from the north
# and the south once a unit comes near the treasury.
#
# Map: marshy lowland on the Si river, crossed by three bridges; reed beds (forest) east of the
# river, villages in the north-west and south-west, the chief's lair in the south-east.

id = "c1_pengcheng1"
name = "팽성 전투"
location = "195년, 서주 팽성국"
objective = "적을 모두 물리쳐라 (유비가 하곤을 설득하면 전투가 끝난다)"
bgm = "battle"
bgm_enemy = "enemy"
turn_limit = 30
reward_gold = 400
intro = "pengcheng1_intro"
outro = "pengcheng1_outro"
victory = [{ type = "defeat_all" }]

[map]
