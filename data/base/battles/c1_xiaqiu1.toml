# Chapter 1, act 3 (서주의 새 주인), bandit camp 2: 하구 전투 1 (First battle of Xiaqiu).
# Game-original bandit suppression near Xiaopei.
#
# PC original: 30 turns, 7 deployable officers; enemy chief Lv12 (bandit) who only moves once a
# player unit comes within his reach, eight bandit squads, two martial artist squads and an archer
# squad; the bandits come down from the mountains and the village to the north is the army's base.
# Victory: annihilate the enemy (400 gold). Liu Bei next to the chief makes him join (Liu Bei +1
# level; the battle ends). Treasury (PC): 소용돌이서.
# (design) The chief is Shi Meng, a character written for this remake (the original's is a
# character invented by KOEI).
#
# Map: open farmland with a village in the north-west where the army starts; the mountains of the
# south-east hold the bandits' camp and a treasury on a high ledge. One wasteland trail (x = 20)
# climbs from the farmland's eastern edge into the camp, so foot and horse units can reach every
# enemy (the victory is to defeat them all); the trail leaving the camp to the south-west and the
# treasury ledge are open to mountain units only. Every enemy outside the camp is aggressive.

id = "c1_xiaqiu1"
name = "하구 전투"
location = "195년, 서주 팽성국 하구"
objective = "적을 모두 물리쳐라 (유비가 석맹을 설득하면 전투가 끝난다)"
bgm = "battle"
bgm_enemy = "enemy"
turn_limit = 30
reward_gold = 400
intro = "xiaqiu1_intro"
outro = "xiaqiu1_outro"
victory = [{ type = "defeat_all" }]

[map]
theme = "field"
rows = '''
,,..,,..,,..,,.,,..,,^^^^^^^
,.,..v.,..,..,..,..,,.,^^^^^
..,.vHv.,..,..TT..,..,,^^^^^
,.,..v..,..,.TTT.,..,.,,^^^^
..,..,.,..,..,T..,..,..,^^^^
,.,..,..,..,..,..,.,..,,,^^^
..TT.,..,..,.,..,..,..,.:^^^
.,TT..,..,..,..,..,..,.::^^^
..,..,..,..,..,..,.,..::^^^^
,.,..,.,..,..,..,.,..:::^^^^
..,..,..,..,..,..,..::^^^^^^
.,..TT..,..,..,.,.:::^^^^^^^
..,.TT.,..,..,.,.::^:^^^^^^^
,.,..,..,..,.,.::^^^:^^^^^^^
..,..,..,.,..:::^^^^bf^^^^^^
^,..,..,..,.::^^^^^:::^^^^^^
^^,..,..,.::^^^^^^::^^^$^^^^
^^^,..,.::^^^^^^^::^^^^:^^^^
^^^^,.::^^^^^^^^::^^^^^:^^^^
^^^^^^^^^^^^^^^^^^^^^^^^^^^^
'''

[deploy]
max = 7
slots = [[3, 2], [2, 2], [3, 1], [3, 3], [2, 1], [2, 3], [1, 2], [4, 1]]

