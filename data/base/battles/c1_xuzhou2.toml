# Chapter 1, act 5 (옥대의 밀조) finale: 서주 전투 2 (Second battle of Xuzhou). Novel chapters
# 21-24: Liu Bei turns against Cao Cao, takes Xuzhou from Cao Cao's governor Che Zhou and is
# scattered by Cao Cao's punitive army; Guan Yu is left at Xiapi, Zhang Fei at Xiaopei.
#
# PC original: 50 turns, 9 deployable officers; Guan Yu and Zhang Fei cannot take part. Phase 1: Che
# Zhou Lv21 (long-weapon infantry) and eight squads hold Xuzhou. When Liu Bei enters the city,
# nineteen units come from the north: Cao Cao (guard cavalry, recovers every turn, high defence),
# Cao Ren, Cao Hong, Yu Jin, Li Dian, Xiahou Dun, Xiahou Yuan, Xu Chu, Guo Jia, Cheng Yu, Xun You,
# Xun Yu and generic squads. Victory, from then on: rout Cao Cao (600 gold) or bring Liu Bei to the
# south-western village (+50 EXP for every survivor; about five turns' march for Liu Bei). No
# treasures, no duel.
# (design) Xuzhou straddles the Si river and is the only crossing, so the escape village in the
# south-west can only be reached through the city, i.e. after Cao Cao's army has arrived; that is
# what chains the victory conditions; Cao Cao's army comes down on the eastern bank and has to force
# its way through the city too, so a rear guard in the city can cover Liu Bei's escape; once Liu
# Bei leaves by the western gate, Xiahou Yuan rides in from the north-west to cut the road. Cao Cao
# carries a 원군보고 (troops recover every turn). The garrison's squads are Lv16.
#
# Map: the Si river runs north-south; the army comes along the eastern road, the city's gates face
# east and west, and the western road runs south to the village.

id = "c1_xuzhou2"
name = "서주 전투"
location = "200년, 서주 동해군"
objective = "차주를 몰아내고 서주성에 들어가라. 그 뒤에는 조조를 물리치거나 남서쪽 마을로 달아나라"
bgm = "battle"
bgm_enemy = "boss"
turn_limit = 50
reward_gold = 600
intro = "xuzhou2_intro"
outro = "xuzhou2_outro"
victory = [
  { type = "defeat_unit", target = "cao_cao" },
  { type = "reach", who = "liu_bei", pos = [2, 21] },
]
bonus = { condition = { type = "reach", who = "liu_bei", pos = [2, 21] }, exp = 50, desc = "유비가 남서쪽 마을로 달아나면 살아남은 전원 경험치 +50" }

