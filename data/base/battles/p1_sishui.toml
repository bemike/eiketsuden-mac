# Prologue, battle 1: 사수관 전투 (Sishui Pass), novel chapter 5.
# Dong Zhuo's vanguard Hua Xiong holds the pass. The coalition's advance guard has already been beaten;
# Liu Bei's three brothers go out to break him.
#
# PC original: 30 turns, 3 deployable officers, enemy Hua Xiong Lv5 (light cavalry), Zhao Cen, Hu Zhen
# (infantry Lv2), Li Su (archer Lv2) and three infantry squads Lv1; Guan Yu moving next to Hua Xiong
# starts the duel that ends the battle (+1 level); a granary and a treasury; 100 gold for the victory.
#
# Map: the Si river crosses the valley below the pass; three bridges lead north to the fortress wall.
# Hua Xiong guards the gate, Zhao Cen sits in the eastern fort, Li Su covers the treasury path from the
# eastern woods, and the infantry squads come down to the bridges. The granary lies in the western
# gully, the treasury in a pocket under the eastern cliffs. Two villages on the southern bank heal.

id = "p1_sishui"
name = "사수관 전투"
location = "190년, 낙양 동쪽 사수관"
objective = "적장 화웅을 물리쳐라"
bgm = "battle"
bgm_enemy = "enemy"
turn_limit = 30
reward_gold = 100
intro = "sishui_intro"
outro = "sishui_outro"
victory = [{ type = "defeat_unit", target = "hua_xiong" }]

[map]
theme = "field"
rows = '''
^^^^^XHcccccHccccHX^^^^^
