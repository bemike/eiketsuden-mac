# --- Events ---------------------------------------------------------------------------------------

# Duel: Guan Yu next to Hua Xiong ends the battle (PC).
[[events]]
trigger = { type = "adjacent", a = "guan_yu", b = "hua_xiong" }
actions = [
  { type = "drama", scene = "sishui_duel" },
  { type = "level_up", target = "guan_yu", amount = 1 },
  { type = "set_flag", flag = "sishui_duel", value = 1 },
  { type = "retreat", target = "hua_xiong" },
  { type = "victory" },
]

# Losing his fellow general makes the gate commander restless.
[[events]]
trigger = { type = "unit_defeated", target = "hu_zhen" }
actions = [{ type = "drama", scene = "sishui_hu_zhen_falls" }]

