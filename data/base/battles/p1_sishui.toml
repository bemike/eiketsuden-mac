^,,v,..TT.._...TT..,,,,^
^,,,,......_.......,,v,^
^^,,.T....._......T.,,^^
^^^,,,....._......,,,^^^
^^^^,,,...._....,,,,^^^^
'''

[deploy]
max = 3
required = ["guan_yu", "zhang_fei"]
slots = [[11, 17], [10, 16], [12, 16], [13, 17]]

