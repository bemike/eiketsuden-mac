# Chapter 1, act 2 (구원의 길), optional: 소패 전투 (Xiaopei). Novel chapter 11: Cao Cao
# presses on against Xuzhou until Lü Bu's attack on Yanzhou forces him home. In the original the
# player may meet Cao Cao in the field here or send an envoy for a truce (and receive a pair of
# swords from Tao Qian).
#
# PC original: nominally 30 turns, 7 deployable officers with Zhao Yun required; allied Tao Qian, Mi
# Fang and Sun Qian among the player's units; enemy Cao Cao Lv23 (heavy cavalry) with eight officers
# about Lv14 and thirteen generic squads about Lv10 (22 units). Victory: rout Cao Cao (300 gold). At
# the start of turn 10 Cao Cao withdraws because Lü Bu strikes at his rear: the battle ends without
# reward. Zhang Fei next to Xiahou Yuan, who waits at the far end of Cao Cao's host, starts a duel
# (+1 level). No treasures.
# (design) Cao Cao's officers keep the same levels whatever was chosen here; the original raises
# their later levels when the player fights.
#
# Map: Xiaopei's fortified line and villages in the west; the Si river with an upper and a lower
# bridge; Cao Cao's host fills the eastern bank, Cao Cao in its centre and Xiahou Yuan far behind.

id = "c1_xiaopei"
name = "소패 전투"
location = "194년, 예주 패국 소패"
objective = "조조를 물리쳐라 (10턴이 되면 조조군이 물러간다)"
bgm = "battle"
bgm_enemy = "boss"
turn_limit = 30
reward_gold = 0
intro = "xiaopei_intro"
outro = "xiaopei_outro"
victory = [{ type = "defeat_unit", target = "cao_cao" }]

[map]
theme = "field"
rows = '''
^^^^,,..,,,~,,..,,^^^^,,..,^
^^,,..,.,,.~..,.TT.^^,,..,,^
^,,.TT.,.,,~.,..TT..,..,.,,^
,,.v.T..,.,~..,.....,..,..,,
,.,...,.,.,~.,,..,...,,...,,
,.,..,.,___=__.,..,..,..,.,,
.,..,.,.,.,~.,..,...,.TT..,.
,.,.v.,..,.~..,.,..,...TT.,.
..,....,.,.~.,..,..,.,..,..,
,.,.f..,.,,~..,.,..,..,..,.,
.v..f.,..,.~.,..,..,.,..,...
,.,.f..,.,,~..,.,..,..,..,.,
..,....,.,.~.,..,..,.,..,..,
,.,.v.,..,.~..,.,..,...TT.,.
,.,..,.,___=__.,..,..,..,.,,
.,..,.,.,.,~.,..,...,.TT..,.
,.,...,.,.,~.,,..,...,,...,,
,,.v.T..,.,~..,.....,..,..,,
^,,.TT.,.,,~.,..TT..,..,.,,^
^^^^,,..,,,~,,..,,^^^^,,..,^
'''

[deploy]
max = 7
required = ["zhao_yun"]
slots = [[7, 10], [8, 10], [7, 9], [7, 11], [8, 9], [8, 11], [6, 10], [9, 10]]

