# --- Events ---------------------------------------------------------------------------------------

# Duel: Zhang Fei next to Xiahou Yuan (+1 level); Xiahou Yuan withdraws.
[[events]]
trigger = { type = "adjacent", a = "zhang_fei", b = "xiahou_yuan" }
actions = [
  { type = "drama", scene = "xiaopei_duel" },
  { type = "level_up", target = "zhang_fei", amount = 1 },
  { type = "retreat", target = "xiahou_yuan" },
]

# Routing Cao Cao is worth 300 gold (PC); the turn-10 withdrawal gives nothing.
[[events]]
trigger = { type = "unit_defeated", target = "cao_cao" }
actions = [
  { type = "drama", scene = "xiaopei_cao_routed" },
  { type = "give_gold", amount = 300 },
]

# PC: Lü Bu falls on Yanzhou and Cao Cao withdraws at the start of turn 10.
[[events]]
trigger = { type = "turn_start", turn = 10 }
actions = [
  { type = "drama", scene = "xiaopei_withdraw" },
  { type = "victory" },
]
