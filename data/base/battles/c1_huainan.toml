actions = [
  { type = "drama", scene = "huainan_betrayal" },
  { type = "retreat", target = "danyang_1" },
  { type = "retreat", target = "danyang_2" },
  { type = "spawn", group = "danyang" },
  { type = "spawn", group = "lu_bu" },
]

# Duel: Guan Yu next to Zhang Liao (+1 level); Zhang Liao withdraws.
[[events]]
trigger = { type = "adjacent", a = "guan_yu", b = "zhang_liao" }
actions = [
  { type = "drama", scene = "huainan_duel" },
  { type = "level_up", target = "guan_yu", amount = 1 },
  { type = "retreat", target = "zhang_liao" },
]

# SS: once Liu Bei nears the fort, every enemy goes for him.
