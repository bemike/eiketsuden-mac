# Chapter 1, act 3 (성난 이리, 여포의 방문) finale: 회남 전투 (Huainan). Novel chapters 14-15: Liu
# Bei, now governor of Xuzhou, marches south against Yuan Shu's general Ji Ling; behind him the
# Danyang troops in Xiapi open the gates to Lü Bu, whom Liu Bei had sheltered at Xiaopei, and Lü
# Bu's army falls on Liu Bei's rear.
#
# PC original: 30 turns, 9 deployable officers; enemy Ji Ling Lv18 (heavy cavalry) with Yue Jiu,
# Chen Ji and nine generic squads south of the river; on turn 6 Lü Bu's army (Zhang Liao, Chen Gong,
# Song Xian, Wei Xu and six squads) appears north of the river. A long bridge must be crossed under
# archer fire. Victory: annihilate the enemy (400 gold) or, once Lü Bu has turned, bring Liu Bei to
# the north-western fort (+50 EXP for every survivor); near the fort every enemy goes for him. Guan
# Yu next to Zhang Liao starts a duel (+1 level). Treasury (PC): 업화서.
# (design) The betrayal comes on turn 7 and is shown on the field: two Danyang squads guard the
# camp as allies and change sides under Xu Dan, the officer who historically let Lü Bu into
# Xiapi. A ridge on the northern bank keeps the fort out of reach until after the betrayal: the
# only way there is south over the long bridge, west along the southern bank and north over the
# western bridge. Ji Ling is PC level 18 in the original; here 15, Lü Bu's officers 11-14 and the
# squads 9-10, because only one bandit camp may have been cleared before, and Lü Bu's army lacks
# one squad (21 enemy units instead of 22).
#
# Map: the Huai river runs east-west; the long bridge (two tiles wide) in the centre, a short one
# in the west. Lü Bu's army appears in the north-west, between the army and the fort, and must
# cross the western bridge to reach the army; the Danyang rear guard turns at the eastern camp.

