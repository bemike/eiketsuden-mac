,..TT..,,.....TT.....,,,
..TTT....,,...TT...,,..^
.v.......,.....,,..,,.^^
,,,..TT....v.....,.,.$^^
^^^,,,,....,,,,....^^^^^
'''

[deploy]
max = 4
slots = [[20, 1], [19, 2], [21, 2], [20, 3], [22, 3]]

