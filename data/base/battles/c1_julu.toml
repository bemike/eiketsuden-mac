# --- Events ---------------------------------------------------------------------------------------

# Duel: Zhang Fei next to Yan Liang (+1 level); Yan Liang withdraws, the battle goes on.
[[events]]
trigger = { type = "adjacent", a = "zhang_fei", b = "yan_liang" }
actions = [
  { type = "drama", scene = "julu_duel" },
  { type = "level_up", target = "zhang_fei", amount = 1 },
  { type = "retreat", target = "yan_liang" },
]

[[events]]
trigger = { type = "turn_start", turn = 3, side = "enemy" }
actions = [
  { type = "spawn", group = "bandits" },
  { type = "drama", scene = "julu_bandits" },
]

[[events]]
trigger = { type = "turn_start", turn = 3, side = "ally" }
actions = [
  { type = "spawn", group = "loyalists" },
  { type = "drama", scene = "julu_loyalists" },
]

# PC: Zhang He moves once Liu Bei is within 10 tiles of the fort ...
[[events]]
trigger = { type = "reach", who = "liu_bei", pos = [1, 9], radius = 10 }
actions = [
  { type = "drama", scene = "julu_zhang_he_fort" },
  { type = "set_ai", target = "zhang_he", ai = "target", ai_target = "liu_bei" },
]

# ... or anyone comes within 9 tiles of him.
[[events]]
trigger = { type = "reach", pos = [16, 15], radius = 9 }
actions = [
  { type = "drama", scene = "julu_zhang_he_moves" },
  { type = "set_ai", target = "zhang_he", ai = "aggressive" },
]

