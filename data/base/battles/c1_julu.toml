# Chapter 1, act 1 (계교 전투), second choice A: 거록 전투 (Julu). Game-original prelude to Jieqiao
# (novel chapter 7). Zhang He holds the Julu plain for Yuan Shao; Gongsun Zan's officers try to
# break through to the western fort, and the Ji province loyalists Geng Wu and Guan Chun, who fled
# Yuan Shao's takeover, come to help.
#
# PC original: 30 turns, 5 deployable officers; two allied officers at the start and two allied
# reinforcements on turn 3 (Geng Wu and Guan Chun, who join afterwards); enemy Zhang He Lv10, Yan
# Liang and Gao Lan Lv7, Shen Pei Lv6, Feng Ji Lv7 and generic squads Lv3-5 (upper village
# detachment, lower village main body, a mobile group), plus three bandit squads on turn 3. Zhang He
# stays put until Liu Bei comes within 10 tiles of the fort or anyone within 9 tiles of him. Victory:
# rout Zhang He (200 gold) or bring Liu Bei to the western fort (+50 EXP for every survivor). Zhang
# Fei next to Yan Liang starts a duel (+1 level, Yan Liang withdraws). The granary holds wheat.
# (design) The allied officers at the start are Tian Kai and Shan Jing (historical Gongsun Zan
# officers) instead of the original's invented officer and Gongsun Yue, who dies before this war in
# the novel. Feng Ji leads the mobile group whichever battle came first.
#
# Map: the Zhang river runs north-south in the west with three bridges; the goal fort stands behind
# a palisade at the far west end of the main road. The upper village holds a detachment, the lower
# village Zhang He's main body with the granary behind it.

id = "c1_julu"
name = "거록 전투"
location = "191년, 기주 거록군"
objective = "적장 장합을 물리치거나 유비가 서쪽 성채에 이르라"
bgm = "battle"
bgm_enemy = "enemy"
turn_limit = 30
reward_gold = 200
intro = "julu_intro"
outro = "julu_outro"
victory = [
  { type = "defeat_unit", target = "zhang_he" },
  { type = "reach", who = "liu_bei", pos = [1, 9] },
]
bonus = { condition = { type = "reach", who = "liu_bei", pos = [1, 9] }, exp = 50, desc = "유비가 서쪽 성채에 이르면 살아남은 전원 경험치 +50" }

[map]
