# Chapter 1, act 2 (구원의 길): 서주 전투 1 (First battle of Xuzhou). Novel chapters 10-11:
# Cao Cao invades Xuzhou to avenge his father; Liu Bei comes to Tao Qian's aid with Kong Rong's and
# Tian Kai's men.
#
# PC original: 30 turns, 7 deployable officers with Zhao Yun required; allied Tao Qian, Mi Fang and
# Sun Qian in the castle and Taishi Ci arriving from the south on turn 5; enemy Yu Jin Lv14, Li
# Dian, Cao Hong, Yue Jin, Xiahou Yuan and Guo Jia about Lv11 and eleven generic squads; the enemy
# cavalry comes from the north. Victory: annihilate the enemy (400 gold) or bring Liu Bei into the
# castle (+50 EXP for every survivor); routing Yu Jin alone does not win. Guan Yu next to Yu Jin
# starts a duel (+1 level, Yu Jin withdraws). No treasures.
#
# Map: the Si river runs north-south with two bridges; beyond it Cao Cao's army besieges Xuzhou,
# whose gate faces west. Xiahou Yuan's cavalry rides in from the northern edge on turn 4 and makes for the upper bridge.

id = "c1_xuzhou1"
name = "서주 전투"
location = "193년, 서주 동해군 담현"
objective = "적을 전멸시키거나 유비가 서주성에 들어가라"
bgm = "battle"
bgm_enemy = "enemy"
turn_limit = 30
reward_gold = 400
intro = "xuzhou1_intro"
outro = "xuzhou1_outro"
victory = [
  { type = "defeat_all" },
  { type = "reach", who = "liu_bei", pos = [24, 11], radius = 1 },
]
bonus = { condition = { type = "reach", who = "liu_bei", pos = [24, 11], radius = 1 }, exp = 50, desc = "유비가 서주성에 들어가면 살아남은 전원 경험치 +50" }

[map]
theme = "field"
rows = '''
