,,.TT..,.,.~,.TT..,.....,.,.,^
,.,TT.,..,.~..TT.,.,.,,..,..,,
..,..v..,..~.,..,..,.,########
,..,....,.,~,.,..,...,#cHcccHc
,.,.,___,__=__.,.,..,.#ccccccc
..,._,..,..~..,.._.,..#Hcccccc
.,._..,.,..~.,.,..,_..#ccccHcc
..,_.,...,.~..,..,..,.#ccccccc
___..,..,..~.,..,..___Gccccccc
..,_.,...,.~..,..,..,.#ccccccc
.,._..,.,..~.,.,..,_..#ccHcccc
..,._,..,..~..,.._.,..#cccccHc
,.,.,___,__=__.,.,..,.#ccccccc
,..,....,.,~,.,..,...,#HcccccH
..,..v..,..~.,..,..,.,########
,.,TT.,..,.~..TT.,.,.,,..,..,,
,,.TT..,.,.~,.TT..,.....,.,.,^
^,,..,.,,..~..,.,,..,.,,,..,^^
^^^,,...,,,~,,..,,..,,,,^^^^^^
