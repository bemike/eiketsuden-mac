# Named officers of the base pack (`OfficerDef` in crates/hero-core/src/data.rs).
#
# Sources and conventions:
#  * Player-side officers: class, joining level and 무력/지력/통솔 (str/int/lead) from the community
#    roster of the original (the stats are the same on every platform). The three brothers start at
#    level 1 as in the PC original.
#  * Enemy and allied officers of the prologue and chapter 1: str/lead from the community table of PC
#    stat corrections; levels from the PC walkthrough where it names them (otherwise the console level
#    lowered to the PC scale). Values the sources do not give are (design) and marked as such.
#  * `level` is the level at the officer's first appearance; battles may override it per spawn.
#    Joining levels follow the PC scale (the brothers start at level 1, chapter-1 recruits join
#    around levels 4-13), not the higher console levels.
#  * Officers invented by KOEI for the original game are deliberately NOT part of this pack
#    (docs/DECISIONS.md D3). Chapter 1 of the original has nine of them; their story slots are
#    filled like this:
#      Guangchuan recruits (infantry, bandit)  -> tian_yu (田豫, historical) and lian_biao (ours)
#      Xindu garrison captain (martial artist) -> yue_lin (ours)
#      Gongsun Zan's officer at Julu           -> tian_kai (田楷, historical)
#      Gongsun Zan's officer cut down at Jieqiao -> an unnamed general, as in the novel (no entry)
#      Kong Rong's officer at Beihai           -> zong_bao (宗寶, novel)
#      Mount Tai bandit chief                  -> chang_xi (昌豨, historical)
#      Xiaqiu and Pengcheng bandit chiefs      -> shi_meng and xia_kun (ours)
#    The Jieqiao archer of Gongsun Zan's army is shan_jing (單經, historical). Characters written
#    for this remake say so in their bio.
#  * Bios are our own one- or two-line summaries.

# ===================================================================================================
# Liu Bei's army
# ===================================================================================================

