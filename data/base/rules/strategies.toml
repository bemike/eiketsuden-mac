# Strategies (책략) of the base pack (`StrategyDef` in crates/hero-core/src/data.rs): the 36 strategies of
# the PC original in eight families, plus one item-only effect (`blast`, used by the bomb).
# `name` is the Korean name players know from the Korean release; `hanja` is the name of the PC original
# (so 해일 shows 津波 and 소용돌이 shows 渦潮). The scroll items in items.toml follow the same rule.
#
# mp, damage power, reach and area are PC values. Reach: range8 = the 3x3 square around the caster,
# range12 = range8 plus the four tiles two steps straight out, range20 = the 5x5 square minus its corners.
# Area: `cross` hits the aimed tile and its four neighbours (the 大 attack strategies and 위장),
# `all_in_range` affects every friendly unit in reach, the caster included (the 大 heals).
# Elements (PC): fire needs plain/grassland/forest/castle floor and fails in rain; water needs plain or a
# bridge and deals +25% in rain; earth needs mountain or wasteland.
#
# (design) values:
#  * Heal power. Only "원조 heals roughly 600-800" is documented. Healing is power + 2 * (INT * level / 50
#    + INT) (docs/RULES.md §5), so power is the base: 원조 400, 보급 800, 구제 1200. The healing food items
#    in items.toml restore exactly these bases, matching "items heal less than the strategy".
#  * Morale amounts: the documented morale-down steps are about -20/-30/-40; the morale-up family uses
#    +20/+35/+50.
#  * Confusion lasts `turns = 2`: the countdown runs at the start of the confused unit's own phase, before
#    it could act, so 2 means "loses its next phase" - the PC behaviour ("wears off after about a turn
#    unless morale is low"). A value of 1 would expire before the victim ever lost an action.

