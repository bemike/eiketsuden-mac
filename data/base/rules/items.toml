# Items of the base pack (`ItemDef` in crates/hero-core/src/data.rs), after the PC original.
#
# Equipment: an officer has one weapon, one war manual (armor slot) and one accessory (horse or
# regeneration treasure). In the PC original anyone may carry anything, so no item restricts `families`.
#
# Prices (shop price; an item sells for half):
#  * Consumables and class-up items: PC prices where documented (콩 100, 초열서 50, 원대서/원부서/원군서
#    500/1,000/2,000, 차 1,200, 폭탄 500, class-up items 200-800); otherwise the console price of the
#    equivalent item, or (design) a price in line with its tier.
#  * Treasures (weapons, war manuals, horses, regeneration treasures, class-change books) are never sold in
#    any shop (`shop` lists in campaign.toml decide what is for sale). Their price only sets the sell value:
#    3,820 sells for 1,910, the value the original pays for such treasures.
#
# Healing food restores exactly the base amount of the matching strategy (strategies.toml), so a strategy
# cast by a capable officer always heals more than the item, as in the original. Scrolls cast their
# strategy with the user's INT and no MP cost.
#
# Icon keys (gfx/ui/icons.toml): item_sword, item_spear, item_blade, item_halberd, item_book (war
# manuals and class-change books), item_horse, item_report, item_edict, item_seal, item_bean, item_wheat,
# item_rice, item_wine, item_medicine, item_scroll_fire, item_scroll_water, item_scroll_earth,
# item_scroll_confuse, item_scroll (the great heal and morale scrolls), item_bomb, item_classup.

