# Terrain of the base pack (`TerrainDef` in crates/hero-core/src/data.rs). The ids and glyphs are the
# canonical set of docs/ASSETS.md; battle maps draw with the glyphs.
#
# defense  - percent of physical damage removed for the unit standing here (PC values).
# heal_hp  - percent of max HP restored at the start of the occupant's phase (design: the PC original
#            restores a small, slightly random amount; the regeneration treasures in items.toml use the
#            same numbers, as in the original).
# elements - attack-strategy elements that can target a unit here (PC): fire on plain, grassland, forest
#            and castle floor; water on plain and bridges; earth on mountains and wasteland; nothing on
#            villages, barracks, forts, granaries and treasuries.
# boost    - elements dealing +25% here (fire in forest).
#
# Move types (keys of `cost`, used by classes.toml), after the move-cost table of the original:
#   foot     - infantry line, archer line, sorcerers, civilians
#   horse    - cavalry line: no forest or mountains, wasteland 2, granary/treasury 3
#   mountain - bandit line, martial artists, beast tamers, tribesmen: may climb mountains
#   slow     - supply wagons and military bands: forest and wasteland cost 2
# Establishments (village, barracks, fort) cost 2 for everyone. A move type missing from `cost` cannot
# enter the tile; river, wall, cliff, house and fence have no costs at all (impassable).

[[terrain]]
id = "plain"
name = "평지"
glyph = "."
defense = 0
elements = ["fire", "water"]
cost = { foot = 1, horse = 1, mountain = 1, slow = 1 }

[[terrain]]
id = "grass"
name = "초원"
glyph = ","
defense = 5
elements = ["fire"]
cost = { foot = 1, horse = 1, mountain = 1, slow = 1 }

