# Unit classes of the base pack (`ClassDef` in crates/hero-core/src/data.rs), after the PC original.
#
# move / atk / def / hp / hp_growth are the PC values: `atk` and `def` are the class terms of the ATK/DEF
# formula (docs/RULES.md §2), `hp` is the troop count at level 1 and `hp_growth` the gain per level.
# generic = [str, int, lead] of unnamed units of the class (PC values).
# Strategy learn levels are the PC values of the community guides; a promoted class keeps the list of its
# predecessors, so a whole line shares one list on its tier-1 class. Levels marked (design) are not
# documented anywhere and were chosen by us.
# Promotion (PC): tier 1 -> 2 at level 15 and tier 2 -> 3 at level 30, each needing its class-up item.
#
# Counters (PC): only the bandit line and martial artists can counter, and only melee attacks from
# cavalry, bandits, martial artists, beast tamers and tribesmen provoke them. Sources disagree about the
# tier-1 bandit (namu's footnote lists only brigands, outlaws and martial artists; the main namu article
# and the Daum guide credit the whole bandit line). We follow the majority: bandits can counter too.
#
# The sprite key of every class is its id (docs/ASSETS.md).

