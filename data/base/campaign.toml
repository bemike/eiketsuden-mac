# Campaign of the base pack (`CampaignDef` in crates/hero-core/src/campaign.rs).
#
# The base pack is the engine's minimal frame (docs/DECISIONS.md D21): the game is the original, which
# the original mode converts from the player's own copy and plays with its own campaign (it takes only
# this campaign's title, starting officers and gold). Without the original, this campaign is one test
# battle: a short note on how to play the original, the Sishui Pass camp and battle, and an end.
#
# The starting army is the original's (the three brothers). The game starts with no gold: the original
# mode takes this campaign's starting gold, and the original's prologue gives the 500 gold Cao Cao hands
# Liu Bei before the first shop by itself. The test opening gives them the same way (`@gold +500`).

title = "刘备传"
start = "test_opening"
starting_officers = ["liu_bei", "guan_yu", "zhang_fei"]
starting_gold = 0

[[node]]
type = "drama"
id = "test_opening"
scene = "test_opening"
next = "camp_sishui"

[[node]]
type = "camp"
id = "camp_sishui"
title = "사수관 — 출진 준비"
shop = ["scroll_scorch", "wine", "bean"]
battle = "p1_sishui"
next = "battle_sishui"

[[node]]
type = "battle"
id = "battle_sishui"
battle = "p1_sishui"
next = "test_end"

[[node]]
type = "ending"
id = "test_end"
title = "시험 전투 완료"
