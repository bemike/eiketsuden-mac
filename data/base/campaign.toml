# Campaign flow of the base pack (`CampaignDef` in crates/hero-core/src/campaign.rs).
#
# Version 0.2 contains the prologue (서장: the anti-Dong Zhuo coalition, Sishui Pass and Hulao Pass)
# and chapter 1 (제1장, acts 1-1 to 1-5). The ending node at the bottom is a temporary end of this
# slice; chapter 2 will continue from `c1_finale`.
#
# Money: the PC original starts with Cao Cao handing Liu Bei 500 gold in the Chenliu camp. We keep that
# as a drama event (`@gold +500` in prologue_chenliu), so a new game starts with 0 gold and reaches the
# first shop with exactly 500. The Chenliu shop (scorch scrolls, wine, beans) is the prologue's only
# shop, as in the original.
#
# Shops follow the town shops of the PC original (namu.wiki "삼국지 영걸전/도구상"):
#   북평 wine, bean, fog scroll
#   신도 wine, bean, salve, scorch / whirlpool / rockfall scrolls (only on the Xindu route)
#   북해 the Xindu list plus bombs
#   서주 wine, bean, salve, great-encourage and great-aid scrolls
#   소패 long spear, repeater, horse armour, martial manual, scorch / whirlpool / rockfall scrolls
#   하비 bean, wheat, great-encourage and great-aid scrolls, bombs
#   허창 long spear, repeater, horse armour, martial manual, wine, fine wine, bean, salve
# Camps without a shop are the original's consecutive battles with no town in between (Jieqiao after
# the second prelude battle, the Guangchuan route's second camp).
#
# Flags set by chapter 1 (dramas unless noted):
#   c1_route_a      1 Xindu / 2 Guangchuan          c1_route_b      1 Julu / 2 Qinghe
#   c1_xiaopei      1 fight Cao Cao at Xiaopei / 0 truce
#   c1_taishan, c1_xiaqiu1, c1_pengcheng1   1 once that bandit camp is cleared
#   c1_bandits      number of bandit camps cleared   c1_bandit_next  camp picked in the menu (0 = done)
#   c1_join_chang_xi, c1_join_shi_meng, c1_join_xia_kun   1 when Liu Bei won that chief over (battles)
#   c1_route_lubu   1 Xiaqiu II / 2 Pengcheng II     c1_gao_shun_duel  1 when Zhang Fei beat Gao Shun (battle)

title = "유비전"
