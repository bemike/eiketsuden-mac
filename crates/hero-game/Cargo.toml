[package]
name = "hero-game"
description = "Eiketsuden Reloaded game executable (native and WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The frontend framework (screens, UI toolkit, platform layer) is a library so it can be unit
# tested without a window and so every public item is usable by the screens built on top of it.
[lib]
name = "hero_game"
path = "src/lib.rs"

[[bin]]
name = "eiketsuden"
path = "src/main.rs"

[dependencies]
hero-core = { path = "../hero-core" }
macroquad = { version = "0.4.16", features = ["audio"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# The Windows executable's icon resource (build.rs); only built on Windows hosts.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
sapp-jsutils = "0.1"

# The decoder macroquad's native audio (quad-snd) uses, with the same features: sounds are checked
# with it before quad-snd decodes them, because quad-snd panics on files it cannot decode.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The original mode converts the player's install at launch (native only, docs/DECISIONS.md D10).
hero-import = { path = "../hero-import" }
audrey = { version = "0.3", default-features = false, features = ["wav", "ogg_vorbis"] }
